<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Multilingual speech transcription workflow</title>
  <desc id="desc">Audio is checked, converted to mono 16 kilohertz, transcribed using Whisper or Wav2Vec2 MMS, then optionally compared with a verified reference using word and character error rates.</desc>
  <defs><style>
    .bg{fill:#fafaf9}.title{font:700 42px Inter,Arial,sans-serif;fill:#111827}.sub{font:18px Inter,Arial,sans-serif;fill:#6b7280}.h{font:650 22px Inter,Arial,sans-serif;fill:#172033}.p{font:16px Inter,Arial,sans-serif;fill:#59616d}.s{font:14px Inter,Arial,sans-serif;fill:#667085}.box{fill:#fff;stroke:#d9dde5;stroke-width:2}.violet{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}.green{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:2}.line{stroke:#8a93a1;stroke-width:3;fill:none;marker-end:url(#arrow)}.accent{fill:#4f46e5}
  </style><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#8a93a1"/></marker></defs>
  <rect width="1600" height="900" rx="24" class="bg"/>
  <text class="title" x="80" y="100">From spoken audio to checked text</text>
  <text class="sub" x="80" y="140">Multilingual ASR workflow · English, Hindi, Telugu · optional transcript scoring</text>
  <rect x="80" y="300" width="290" height="220" rx="20" class="box"/>
  <circle cx="225" cy="370" r="42" fill="#f3f4f6"/><path d="M218 349v42a17 17 0 0034 0v-42a17 17 0 00-34 0zm-19 38a36 36 0 0072 0m-36 36v20m-23 0h46" fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
  <text class="h" x="225" y="465" text-anchor="middle">Audio clip</text><text class="p" x="225" y="493" text-anchor="middle">WAV / FLAC input</text>
  <path class="line" d="M370 410H435"/>
  <rect x="450" y="300" width="300" height="220" rx="20" class="box"/>
  <text class="h" x="600" y="363" text-anchor="middle">Prepare audio</text>
  <rect x="495" y="390" width="210" height="38" rx="19" class="violet"/><text class="p" x="600" y="415" text-anchor="middle">Convert to mono</text>
  <rect x="495" y="442" width="210" height="38" rx="19" class="violet"/><text class="p" x="600" y="467" text-anchor="middle">Resample to 16 kHz</text>
  <path class="line" d="M750 410H815"/>
  <rect x="830" y="260" width="330" height="110" rx="20" class="violet"/>
  <text class="h" x="995" y="307" text-anchor="middle">Whisper Tiny</text><text class="p" x="995" y="338" text-anchor="middle">Encoder-decoder · multilingual</text>
  <rect x="830" y="410" width="330" height="110" rx="20" class="violet"/>
  <text class="h" x="995" y="457" text-anchor="middle">Wav2Vec2 MMS</text><text class="p" x="995" y="488" text-anchor="middle">CTC · language adapter selected</text>
  <path class="line" d="M1160 315C1210 315 1195 390 1245 390"/><path class="line" d="M1160 465C1210 465 1195 410 1245 410"/>
  <rect x="1260" y="310" width="270" height="180" rx="20" class="box"/>
  <text class="h" x="1395" y="365" text-anchor="middle">Transcript</text><text class="p" x="1395" y="399" text-anchor="middle">Review text and language</text><text class="s" x="1395" y="440" text-anchor="middle">No score without a reference</text>
  <path class="line" d="M1395 490V625H1170"/>
  <rect x="790" y="580" width="740" height="190" rx="22" class="green"/>
  <text class="h" x="1160" y="635" text-anchor="middle">Optional evaluation with human-verified text</text>
  <rect x="865" y="670" width="270" height="56" rx="28" fill="#fff" stroke="#bbf7d0" stroke-width="2"/><text class="p" x="1000" y="705" text-anchor="middle">Word Error Rate (WER)</text>
  <rect x="1185" y="670" width="270" height="56" rx="28" fill="#fff" stroke="#bbf7d0" stroke-width="2"/><text class="p" x="1320" y="705" text-anchor="middle">Character Error Rate (CER)</text>
  <text class="s" x="80" y="828">Metrics depend on audio quality, language, transcription rules, and reference accuracy.</text>
</svg>
